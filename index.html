<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Rodent Sign Check</title>
<meta name="theme-color" content="#F2C200">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3E4E0; --surface:#F5F5F2; --ink:#22262A; --muted:#5B6167; --line:#C4C6C1;
  --safety:#F2C200; --tape:#2B2F33; --on-safety:#22262A;
  --danger:#B3322A; --amber:#8F5B00; --ok:#2C7346;
  --danger-bg:#F6E1DE; --amber-bg:#F7EBCF; --ok-bg:#DDEDE2;
  --cell:rgba(255,255,255,.7);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181B1D; --surface:#23272A; --ink:#E7E8E3; --muted:#9BA1A6; --line:#3A3F44;
    --safety:#E9BB0A; --tape:#33383C; --on-safety:#1E2124;
    --danger:#E2675C; --amber:#E0A43A; --ok:#62B486;
    --danger-bg:#3A2422; --amber-bg:#3A3020; --ok-bg:#1F3328;
    --cell:rgba(255,255,255,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181B1D; --surface:#23272A; --ink:#E7E8E3; --muted:#9BA1A6; --line:#3A3F44;
  --safety:#E9BB0A; --tape:#33383C; --on-safety:#1E2124;
  --danger:#E2675C; --amber:#E0A43A; --ok:#62B486;
  --danger-bg:#3A2422; --amber-bg:#3A3020; --ok-bg:#1F3328;
  --cell:rgba(255,255,255,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Barlow","Helvetica Neue",Arial,system-ui,sans-serif;
  font-size:17px; line-height:1.55;
}
main{max-width:720px; margin:0 auto; padding:14px 18px 56px}
.toolbar{display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-bottom:6px}
.lang{display:flex; border:1.5px solid var(--ink); border-radius:8px; overflow:hidden}
.lang button{font:inherit; font-weight:600; font-size:.9rem; min-height:36px; min-width:44px; padding:4px 10px; border:0; background:transparent; color:var(--ink); cursor:pointer}
.lang button + button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.lang button:focus-visible{outline:3px solid var(--safety); outline-offset:-3px}
.linkbtn{font:inherit; font-weight:600; background:none; border:0; color:var(--ink); text-decoration:underline; text-underline-offset:4px; cursor:pointer; min-height:36px; padding:4px 6px}
.linkbtn:focus-visible{outline:3px solid var(--ink); outline-offset:2px; border-radius:4px}
h1{font-size:2.1rem; font-weight:800; line-height:1.1; margin:0 0 8px; letter-spacing:-.01em}
.lede{margin:0 0 20px; color:var(--muted); max-width:58ch}

.settings{margin:0 0 20px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px}
.settings summary{cursor:pointer; font-weight:600}
.settings .row{display:grid; gap:6px; margin-top:12px}
.settings label{font-weight:600; font-size:.95rem}
.settings input{
  font:inherit; color:var(--ink); background:var(--bg); border:1.5px solid var(--line);
  border-radius:8px; padding:9px 10px; width:100%; min-width:0;
}
.settings .row > *{min-width:0}
.settings input:focus-visible{outline:3px solid var(--safety); outline-offset:1px}
.settings .small{font-size:.88rem; color:var(--muted); margin:4px 0 0}
.settings .btns{justify-content:flex-start; margin-top:12px}
.keynote{font-weight:600}

.tape{padding:10px; border-radius:14px; background:repeating-linear-gradient(-45deg,var(--safety) 0 18px,var(--tape) 18px 36px)}
.drop{background:var(--surface); border-radius:6px; padding:30px 20px; text-align:center}
.drop.drag{box-shadow:inset 0 0 0 3px var(--safety)}
.drop-title{font-size:1.35rem; font-weight:800; margin:0}
.drop-sub{margin:2px 0 18px; color:var(--muted)}
.btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}

details.box{margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px}
details.box summary{cursor:pointer; font-weight:600}
details.box ul{margin:8px 0 2px; padding-left:20px}
details.box li + li{margin-top:4px}

.btn{
  font:inherit; font-weight:600; min-height:44px; padding:8px 18px;
  border-radius:10px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer;
}
.btn.primary{background:var(--safety); border-color:var(--safety); color:var(--on-safety)}
.btn.ghost{border-color:transparent; text-decoration:underline; text-underline-offset:4px}
.btn.small{min-height:36px; padding:4px 10px; font-size:.93rem}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--ink); outline-offset:2px}

.stage{position:relative; width:fit-content; max-width:100%; margin:0 auto}
.stage img{display:block; max-width:100%; max-height:70vh; width:auto; height:auto; border-radius:8px}
.overlay{position:absolute; inset:0; border-radius:8px; overflow:hidden}
.cell{position:absolute; border:1px dashed var(--cell); pointer-events:none}
.cell.solo{border-color:transparent}
.cell.scanning{
  border:2px solid var(--safety);
  background:repeating-linear-gradient(-45deg,rgba(242,194,0,.3) 0 10px,transparent 10px 20px);
  animation:scan 1.1s ease-in-out infinite alternate;
}
.cell.flag{border:3px solid var(--danger); background:transparent}
.cell.suspect{border:3px solid var(--amber); background:transparent}
.cell.clear{border:1px dashed rgba(255,255,255,.3)}
.cell.failed{border:2px dashed #9BA1A6; background:rgba(0,0,0,.25)}
@keyframes scan{from{opacity:.5}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.cell.scanning{animation:none} .progress > div{transition:none}}
.trim{margin:8px 2px 0; text-align:center; color:var(--muted); font-size:.9rem}

.mark,.num{
  width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
  font-weight:800; font-size:.95rem; line-height:1; color:#fff; background:var(--danger);
}
.mark{position:absolute; transform:translate(-50%,-50%); border:2px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.35); padding:0; font-family:inherit; cursor:pointer}
.mark::after{content:""; position:absolute; inset:-9px}
.mark:focus-visible{outline:3px solid var(--safety); outline-offset:2px}
.mid{background:var(--amber)} .low{background:#6B7177}

.controls{margin-top:18px; display:grid; gap:14px}
.seg{border:0; padding:0; margin:0}
.seg legend{font-weight:600; padding:0; margin-bottom:6px}
.seg-row{display:flex; border:1.5px solid var(--ink); border-radius:10px; overflow:hidden}
.seg-row label{flex:1; position:relative}
.seg-row input{position:absolute; opacity:0; inset:0; margin:0}
.seg-row span{display:block; text-align:center; padding:9px 6px; cursor:pointer}
.seg-row label + label span{border-left:1px solid var(--line)}
.seg-row input:checked + span{background:var(--ink); color:var(--surface); font-weight:600}
.seg-row input:focus-visible + span{outline:3px solid var(--safety); outline-offset:-3px}
.hint{color:var(--muted); font-size:.92rem; margin:6px 2px 0}
.actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

.progress{height:10px; margin-top:16px; border-radius:5px; background:var(--line); overflow:hidden}
.progress > div{height:100%; width:0; background:repeating-linear-gradient(-45deg,var(--safety) 0 10px,var(--tape) 10px 20px); transition:width .35s ease-out}
.status{min-height:1.6em; margin:10px 2px 0; color:var(--muted)}
.status.err{color:var(--danger); font-weight:600}

.verdict{margin-top:18px; border-radius:10px; padding:14px 18px; border-left:8px solid var(--c); background:var(--cbg)}
.verdict h2{margin:0; font-size:1.5rem; font-weight:800; color:var(--c); line-height:1.25}
.verdict p{margin:4px 0 0}
.risk{display:inline-block; margin:0 0 6px; padding:1px 10px; border-radius:999px; border:1.5px solid var(--c); color:var(--c); font-weight:800; font-size:.88rem}
.v-bad{--c:var(--danger); --cbg:var(--danger-bg)}
.v-warn{--c:var(--amber); --cbg:var(--amber-bg)}
.v-ok{--c:var(--ok); --cbg:var(--ok-bg)}
.note{margin:8px 0 0; font-size:.95rem; color:var(--muted)}

.findings{list-style:none; padding:0; margin:16px 0 0; display:grid; gap:10px}
.findings li{display:grid; grid-template-columns:28px 1fr; gap:12px; align-items:start;
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
.what{font-weight:600; margin:0}
.meta{color:var(--muted); font-size:.93rem; margin:0}
.desc{margin:2px 0 0}
.findings .btn{margin-top:8px}
.conds{margin-top:16px; background:var(--surface); border:1px solid var(--line); border-left:8px solid var(--amber); border-radius:10px; padding:12px 16px}
.conds h3{margin:0; font-size:1.05rem}
.conds ul{margin:6px 0 0; padding-left:20px}
.conds li + li{margin-top:4px}
.fine{color:var(--muted); font-size:.88rem; margin-top:22px; max-width:62ch}

dialog{border:0; padding:0; border-radius:14px; background:var(--surface); color:var(--ink); width:min(94vw,640px); max-height:88vh; box-shadow:0 10px 40px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-head{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 10px 10px 18px; border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0; font-size:1.2rem; font-weight:800; line-height:1.25}
.dlg-body{padding:14px 18px 20px; overflow:auto; max-height:calc(88vh - 64px)}
.dlg-body p{margin:0 0 10px; max-width:60ch}
#zoomCanvas{display:block; width:100%; height:auto; border-radius:8px; background:#000; margin-bottom:10px}
.ver{color:var(--muted); font-weight:600}
[hidden]{display:none !important}
</style>
</head>
<body>
<main>
  <div class="toolbar">
    <div class="lang" role="group" aria-label="Language / Sprache">
      <button type="button" id="langEn" lang="en" aria-label="English">EN</button>
      <button type="button" id="langDe" lang="de" aria-label="Deutsch">DE</button>
    </div>
    <button type="button" class="linkbtn" id="aboutBtn" data-i18n="about">About</button>
  </div>

  <h1 data-i18n="title">Rodent sign check</h1>
  <p class="lede" data-i18n="lede"></p>

  <details class="settings" id="settings">
    <summary data-i18n="settings">Settings</summary>
    <p class="small keynote" id="keyState"></p>
    <div class="row">
      <label for="key" data-i18n="keyLabel"></label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="AQ.…">
      <p class="small" data-i18n="keyHelp"></p>
    </div>
    <div class="row">
      <label for="model" data-i18n="modelLabel"></label>
      <input id="model" list="models" autocomplete="off" spellcheck="false">
      <datalist id="models">
        <option value="gemini-3.8-flash">
        <option value="gemini-3.6-flash">
        <option value="gemini-3.5-flash-lite">
        <option value="gemini-2.5-flash">
      </datalist>
      <p class="small" data-i18n="modelHelp"></p>
    </div>
    <div class="btns">
      <button class="btn primary" id="saveKey" type="button" data-i18n="save"></button>
      <button class="btn ghost" id="forgetKey" type="button" data-i18n="removeKey"></button>
    </div>
  </details>

  <section id="pick">
    <div class="tape">
      <div class="drop" id="drop">
        <p class="drop-title" data-i18n="dropTitle"></p>
        <p class="drop-sub" data-i18n="dropSub"></p>
        <div class="btns">
          <button class="btn primary" id="camBtn" type="button" data-i18n="takePhoto"></button>
          <button class="btn" id="galBtn" type="button" data-i18n="gallery"></button>
        </div>
        <input type="file" accept="image/jpeg,image/png,image/webp,image/*" capture="environment" id="cam" hidden>
        <input type="file" accept="image/jpeg,image/png,image/webp,image/*" id="gal" hidden>
      </div>
    </div>
    <details class="box" id="guide">
      <summary data-i18n="guideTitle"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
      </ul>
    </details>
  </section>

  <section id="work" hidden>
    <div class="stage">
      <img id="photo" alt="">
      <div class="overlay" id="overlay"></div>
    </div>
    <p class="trim" id="trimNote" data-i18n="trimmed" hidden></p>

    <div class="controls">
      <fieldset class="seg">
        <legend data-i18n="gridLegend"></legend>
        <div class="seg-row">
          <label><input type="radio" name="grid" value="1"><span data-i18n="whole"></span></label>
          <label><input type="radio" name="grid" value="2" checked><span data-i18n="four"></span></label>
          <label><input type="radio" name="grid" value="3"><span data-i18n="nine"></span></label>
        </div>
        <p class="hint" data-i18n="gridHint"></p>
      </fieldset>
      <div class="actions">
        <button class="btn primary" id="run" type="button" data-i18n="run"></button>
        <button class="btn" id="stop" type="button" data-i18n="stop" hidden></button>
        <button class="btn ghost" id="reset" type="button" data-i18n="newPhoto"></button>
      </div>
    </div>

    <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><div id="bar"></div></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section id="result" hidden>
      <div class="verdict" id="verdict"></div>
      <ol class="findings" id="findings"></ol>
      <div class="conds" id="conds" hidden>
        <h3 data-i18n="condTitle"></h3>
        <ul id="condList"></ul>
      </div>
      <details class="box" id="lookWrap" hidden>
        <summary data-i18n="lookTitle"></summary>
        <ul id="look"></ul>
      </details>
    </section>
  </section>

  <p class="fine" data-i18n="fine"></p>
</main>

<dialog id="zoomDlg" aria-labelledby="zoomTitle">
  <div class="dlg-head">
    <h2 id="zoomTitle"></h2>
    <button class="btn ghost small" type="button" data-close data-i18n="close"></button>
  </div>
  <div class="dlg-body">
    <canvas id="zoomCanvas" width="900" height="900"></canvas>
    <p class="meta" id="zoomMeta"></p>
    <p class="desc" id="zoomNote"></p>
  </div>
</dialog>

<dialog id="aboutDlg" aria-labelledby="aboutTitle">
  <div class="dlg-head">
    <h2 id="aboutTitle" data-i18n="aboutTitle"></h2>
    <button class="btn ghost small" type="button" data-close data-i18n="close"></button>
  </div>
  <div class="dlg-body">
    <p class="ver" id="ver"></p>
    <p data-i18n="about1"></p>
    <p data-i18n="about2"></p>
    <p data-i18n="about3"></p>
    <p data-i18n="about4"></p>
  </div>
</dialog>

  const loadImage = (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const loadInto = (img, url) => new Promise((res, rej) => { img.onload = () => res(); img.onerror = rej; img.src = url; });

  // Finds flat black or white bands around the picture (screenshots, letterboxing).
  function contentRect(img) {
    const W = img.naturalWidth, H = img.naturalHeight;
    const s = Math.min(1, 360 / Math.max(W, H));
    const w = Math.max(1, Math.round(W * s)), h = Math.max(1, Math.round(H * s));
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, w, h);
    let d;
    try { d = ctx.getImageData(0, 0, w, h).data; } catch { return null; }
    const lum = (i) => 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    const flat = (idx, n) => {
      let sum = 0, sq = 0;
      for (let k = 0; k < n; k++) { const v = lum(idx(k)); sum += v; sq += v * v; }
      const m = sum / n, sd = Math.sqrt(Math.max(0, sq / n - m * m));
      return (m < 32 || m > 238) && sd < 6;
    };
    const rowFlat = (y) => flat((x) => (y * w + x) * 4, w);
    let top = 0; while (top < h - 1 && rowFlat(top)) top++;
    let bot = h - 1; while (bot > top && rowFlat(bot)) bot--;
    const colFlat = (x) => flat((k) => ((top + k) * w + x) * 4, bot - top + 1);
    let left = 0; while (left < w - 1 && colFlat(left)) left++;
    let right = w - 1; while (right > left && colFlat(right)) right--;
    const cutT = top, cutB = h - 1 - bot, cutL = left, cutR = w - 1 - right;
    if (Math.max(cutT / h, cutB / h, cutL / w, cutR / w) < 0.02) return null;
    if ((right - left + 1) < w * 0.25 || (bot - top + 1) < h * 0.25) return null;
    const x0 = cutL ? (left + 1) / s : 0, x1 = cutR ? right / s : W;
    const y0 = cutT ? (top + 1) / s : 0, y1 = cutB ? bot / s : H;
    if (x1 - x0 < 50 || y1 - y0 < 50) return null;
    return { x: Math.round(x0), y: Math.round(y0), w: Math.round(x1 - x0), h: Math.round(y1 - y0) };
  }

  async function loadFile(file) {
    if (!file || state.running) return;
    $("#cam").value = ""; $("#gal").value = "";
    if (!file.type.startsWith("image/")) { setStatus([["notImage"]], true); return; }
    const srcUrl = URL.createObjectURL(file);
    let orig;
    try { orig = await loadImage(srcUrl); } catch { URL.revokeObjectURL(srcUrl); setStatus([["cantOpen"]], true); return; }
    let url = srcUrl, trimmed = false;
    const rect = contentRect(orig);
    if (rect) {
      const sc = Math.min(1, 4096 / Math.max(rect.w, rect.h));
      const cv = document.createElement("canvas");
      cv.width = Math.round(rect.w * sc); cv.height = Math.round(rect.h * sc);
      cv.getContext("2d").drawImage(orig, rect.x, rect.y, rect.w, rect.h, 0, 0, cv.width, cv.height);
      const blob = await new Promise((r) => cv.toBlob(r, "image/jpeg", 0.92));
      if (blob) { URL.revokeObjectURL(srcUrl); url = URL.createObjectURL(blob); trimmed = true; }
    }
    if (state.url) URL.revokeObjectURL(state.url);
    state.url = url;
    const img = $("#photo");
    try { await loadInto(img, url); } catch { setStatus([["cantOpen"]], true); return; }
    state.img = img;
    state.trimmed = trimmed;
    $("#trimNote").hidden = !trimmed;
    $("#pick").hidden = true;
    $("#work").hidden = false;
    clearResults();
    drawCells(makeTiles(img, state.grid));
    setStatus(null);
    $("#run").focus();
  }

  document.querySelectorAll('input[name="grid"]').forEach((r) =>
    r.addEventListener("change", () => {
      state.grid = Number(r.value);
      if (state.img && !state.running) { clearResults(); drawCells(makeTiles(state.img, state.grid)); setStatus(null); }
    })
  );

  $("#reset").addEventListener("click", () => {
    if (state.running) return;
    state.img = null;
    $("#work").hidden = true;
    $("#pick").hidden = false;
    clearResults();
    setStatus(null);
  });
  $("#stop").addEventListener("click", () => state.ctl?.abort());
  $("#run").addEventListener("click", run);

  // ---------- tiling ----------
  function makeTiles(img, g) {
    const W = img.naturalWidth, H = img.naturalHeight;
    const cw = W / g, ch = H / g, ov = g > 1 ? 0.12 : 0;
    const tiles = [];
    for (let r = 0; r < g; r++) for (let c = 0; c < g; c++) {
      const x0 = Math.max(0, c * cw - cw * ov), y0 = Math.max(0, r * ch - ch * ov);
      const x1 = Math.min(W, (c + 1) * cw + cw * ov), y1 = Math.min(H, (r + 1) * ch + ch * ov);
      tiles.push({
        id: r * g + c + 1,
        cell: { x: (c * cw) / W, y: (r * ch) / H, w: cw / W, h: ch / H },
        crop: { x: x0, y: y0, w: x1 - x0, h: y1 - y0 },
      });
    }
    return tiles;
  }

  // Up to 4 tiles: one request each, all at once. 9 tiles: one request per row.
  function groupTiles(tiles) {
    if (tiles.length <= 4) return tiles.map((x) => [x]);
    const per = Math.ceil(tiles.length / 3);
    const groups = [];
    tiles.forEach((x, i) => { (groups[Math.floor(i / per)] ||= []).push(x); });
    return groups;
  }

  function tileBase64(img, crop) {
    const s = Math.min(1, TILE_MAX / Math.max(crop.w, crop.h));
    const cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(crop.w * s));
    cv.height = Math.max(1, Math.round(crop.h * s));
    cv.getContext("2d").drawImage(img, crop.x, crop.y, crop.w, crop.h, 0, 0, cv.width, cv.height);
    return cv.toDataURL("image/jpeg", JPEG_Q).split(",")[1];
  }

  function drawCells(tiles) {
    const ov = $("#overlay");
    ov.replaceChildren();
    for (const x of tiles) {
      const d = document.createElement("div");
      d.className = "cell" + (tiles.length === 1 ? " solo" : "");
      d.dataset.id = x.id;
      Object.assign(d.style, { left: x.cell.x * 100 + "%", top: x.cell.y * 100 + "%", width: x.cell.w * 100 + "%", height: x.cell.h * 100 + "%" });
      ov.append(d);
    }
  }
  const cellEl = (id) => $(`#overlay .cell[data-id="${id}"]`);

  // ---------- prompt ----------
  function buildPrompt(ids) {
    return `You are helping a worker inspect a food-distribution warehouse for signs of rodent activity.
Above are ${ids.length} image(s). Each one is a crop (tile) of a single larger photo showing the warehouse floor, pallets, cartons or wall edges. Each image is preceded by its tile id.

Examine every tile closely, including tiny details, for these signs:
- droppings: house mouse about 3-6 mm, spindle-shaped with pointed ends, dark; rat about 12-20 mm, thicker with blunt ends
- gnaw: paired parallel incisor grooves on wood or plastic, ragged chewed holes or shredded edges on cardboard or packaging
- grease: dark smudges or rub marks along walls, edges or entry gaps
- nest: shredded paper, cardboard, plastic or insulation gathered in a clump
- urine: stains or crusty spots, often next to droppings
- tracks: small footprints or tail-drag lines in dust, flour or powder
- rodent: a live or dead mouse or rat

Separately, note conditions that attract rodents or let them in. These are not signs of rodents by themselves:
- entry: gaps under doors, holes in walls or around pipes wider than about 6 mm
- food: spilled food, grain, crumbs or sticky residue
- packaging: torn or open packaging with no sign of chewing
- clutter: rubbish, unused material or hiding places along walls
- moisture: standing water, leaks or wet areas

Be conservative. Warehouse floors often have look-alikes: dirt clumps, coffee grounds, seeds or grain, raisins, small rubber or plastic bits, insect droppings, wood splinters, torn stretch wrap, pallet-wheel debris. Report a finding only when the visible evidence supports it, and use confidence (0-100) honestly. For droppings judge freshness: fresh ones look dark, glossy and moist; old ones look dull, grey and crumbly.

Write every "note" and "lookalike" text in ${t("promptLang")}.

Reply with only JSON, no other text, in exactly this shape:
{"tiles":[{"tile":<tile id>,"quality":"ok"|"blurry"|"dark"|"too_far","findings":[{"type":"droppings"|"gnaw"|"grease"|"nest"|"urine"|"tracks"|"rodent","animal":"mouse"|"rat"|"unclear","freshness":"fresh"|"old"|"unclear","count":<integer>,"confidence":<0-100>,"x":<0-100>,"y":<0-100>,"note":"<one short sentence>"}],"conditions":[{"kind":"entry"|"food"|"packaging"|"clutter"|"moisture","note":"<one short sentence>"}],"lookalike":"<one short sentence about anything you ruled out as a look-alike, or empty string>"}]}

x and y give the approximate centre of the finding inside that tile, as a percentage of the tile's width measured from the left edge and of its height measured from the top edge. Use empty arrays when a tile shows nothing. Include every tile id (${ids.join(", ")}) exactly once.`;
  }

  function buildParts(tiles, img) {
    const parts = [];
    for (const x of tiles) {
      parts.push({ text: `Tile ${x.id}:` });
      parts.push({ inlineData: { mimeType: "image/jpeg", data: tileBase64(img, x.crop) } });
    }
    parts.push({ text: buildPrompt(tiles.map((x) => x.id)) });
    return parts;
  }

  function sleep(ms, signal) {
    return new Promise((res, rej) => {
      if (signal?.aborted) { rej({ kind: "cancelled" }); return; }
      const tm = setTimeout(res, ms);
      signal?.addEventListener("abort", () => { clearTimeout(tm); rej({ kind: "cancelled" }); }, { once: true });
    });
  }

  // ---------- model calls ----------
  const busyUntil = {};   // model -> time until which it is tried last
  const noThink = {};     // models that rejected the thinking setting

  function genConfig(model) {
    const g = { responseMimeType: "application/json", maxOutputTokens: 8192 };
    if (!noThink[model]) g.thinkingConfig = /^gemini-2\./.test(model) ? { thinkingBudget: 0 } : { thinkingLevel: "low" };
    return g;
  }

  // Busy or rate-limited models are skipped at once; they go to the back of the line for a few minutes.
  async function callWithFallback(tiles, img, signal) {
    const parts = buildParts(tiles, img);
    const all = [cfg.model, ...FALLBACK_MODELS.filter((m) => m !== cfg.model)];
    let lastErr = null;
    for (let pass = 0; pass < 2; pass++) {
      const now = Date.now();
      const order = pass === 0 ? [...all.filter((m) => !(busyUntil[m] > now)), ...all.filter((m) => busyUntil[m] > now)] : all;
      for (let i = 0; i < order.length; i++) {
        const model = order[i];
        try {
          return { res: await requestModel(parts, model, signal), model };
        } catch (e0) {
          let e = e0;
          if (e?.kind === "cancelled") throw e;
          if (e?.kind === "http" && e.status === 400 && /thinking/i.test(e.msg) && !noThink[model]) {
            noThink[model] = true;
            try { return { res: await requestModel(parts, model, signal), model }; }
            catch (e2) { if (e2?.kind === "cancelled") throw e2; e = e2; }
          }
          lastErr = e;
          const busy = e?.kind === "http" && (e.status >= 500 || e.status === 429);
          const missing = e?.kind === "http" && e.status === 404;
          if (busy) busyUntil[model] = Date.now() + (e.status === 429 ? 60e3 : 180e3);
          if (missing) busyUntil[model] = Date.now() + 3600e3;
          if (!busy && !missing) throw e;
          if (i < order.length - 1 && state.running) setStatus([["busySwitch", { a: model, b: order[i + 1] }]]);
        }
      }
      if (!(lastErr?.kind === "http" && lastErr.status >= 500)) break;
      await sleep(1500, signal);
    }
    throw lastErr;
  }

  async function requestModel(parts, model, signal) {
    let r;
    try {
      r = await fetch(`${API_BASE}${encodeURIComponent(model)}:generateContent`, {
        method: "POST",
        signal,
        headers: { "content-type": "application/json", "x-goog-api-key": cfg.key },
        body: JSON.stringify({ contents: [{ role: "user", parts }], generationConfig: genConfig(model) }),
      });
    } catch (e) {
      if (e && e.name === "AbortError") throw { kind: "cancelled" };
      throw { kind: "network" };
    }
    let data = null;
    try { data = await r.json(); } catch {}
    if (!r.ok) throw { kind: "http", status: r.status, msg: data?.error?.message || "", gstatus: data?.error?.status || "" };
    if (data?.promptFeedback?.blockReason) throw { kind: "blocked" };
    const cand = data?.candidates?.[0];
    const text = (cand?.content?.parts || []).filter((p) => typeof p.text === "string" && !p.thought).map((p) => p.text).join("\n");
    if (!text.trim()) throw { kind: cand?.finishReason === "MAX_TOKENS" ? "long" : "parse" };
    return parseJSON(text);
  }

  function parseJSON(text) {
    const s = text.replace(/```json|```/g, "").trim();
    try { return JSON.parse(s); } catch {}
    const a = s.indexOf("{"), b = s.lastIndexOf("}");
    if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch {} }
    throw { kind: "parse" };
  }

  function errorKey(e) {
    if (!e || e.kind === "network") return "errNetwork";
    if (e.kind === "parse") return "errParse";
    if (e.kind === "long") return "errLong";
    if (e.kind === "blocked") return "errBlocked";
    if (e.kind === "http") {
      if (/api key not valid|API_KEY_INVALID/i.test(e.msg)) return "errKey";
      if (/location is not supported/i.test(e.msg)) return "errRegion";
      if (e.status === 429 || e.gstatus === "RESOURCE_EXHAUSTED") return "errLimit";
      if (e.status === 404 || /not found|not supported for generateContent/i.test(e.msg)) return "errModel";
      if (e.status === 401 || e.status === 403) return "errForbidden";
      if (e.status >= 500) return "errServer";
      return null;
    }
    return "errGeneric";
  }
  function errorParts(e) {
    const k = errorKey(e);
    const out = k ? [[k]] : [t("errFailed") + (e.msg ? ": " + e.msg : ".")];
    if (e?.kind === "http" && (e.msg || e.status)) out.push(`[Google ${e.status}${e.msg ? ": " + String(e.msg).slice(0, 220) : ""}]`);
    return out;
  }

  // ---------- run ----------
  async function run() {
    if (state.running || !state.img) return;
    if (!cfg.key) {
      $("#settings").open = true;
      $("#key").focus();
      setStatus([["addKeyFirst"]], true);
      return;
    }
    const img = state.img;
    const tiles = makeTiles(img, state.grid);
    const groups = groupTiles(tiles);
    clearResults();
    drawCells(tiles);
    setBusy(true);
    tiles.forEach((x) => cellEl(x.id)?.classList.add("scanning"));
    setProgress(0, tiles.length);
    setStatus(tiles.length === 1 ? [["checkingOne"]] : [["progress", { done: 0, total: tiles.length }]]);

    const ctl = new AbortController();
    state.ctl = ctl;
    const t0 = performance.now();
    const acc = { all: [], quality: new Set(), look: [], conds: [], done: 0, failed: 0, models: new Set(), lastErr: null };

    await Promise.all(groups.map(async (g) => {
      try {
        const { res, model } = await callWithFallback(g, img, ctl.signal);
        acc.models.add(model);
        absorb(res, g, img, acc);
      } catch (e) {
        if (e?.kind === "cancelled") return;
        acc.failed += g.length;
        acc.lastErr = e;
        g.forEach((x) => { const el = cellEl(x.id); el?.classList.remove("scanning"); el?.classList.add("failed"); });
      }
      acc.done += g.length;
      if (ctl.signal.aborted) return;
      setProgress(acc.done, tiles.length);
      if (acc.done < tiles.length) setStatus([["progress", { done: acc.done, total: tiles.length }]]);
      if (acc.done > acc.failed) showResults(acc, img);
    }));

    state.ctl = null;
    setBusy(false);
    $("#progress").hidden = true;
    tiles.forEach((x) => cellEl(x.id)?.classList.remove("scanning"));

    if (ctl.signal.aborted) { setStatus([["stopped"]]); return; }
    if (acc.failed === tiles.length) { setStatus(errorParts(acc.lastErr), true); return; }

    const secs = Math.round((performance.now() - t0) / 100) / 10;
    const parts = [["doneIn", { s: secs }]];
    const others = [...acc.models].filter((m) => m !== cfg.model);
    if (others.length) parts.push(["usedFallback", { m: others.join(", "), d: cfg.model }]);
    if (acc.failed) parts.push(["partialFail", { n: acc.failed, total: tiles.length }], ...errorParts(acc.lastErr));
    setStatus(parts, acc.failed > 0);
  }

  function absorb(res, group, img, acc) {
    const W = img.naturalWidth, H = img.naturalHeight;
    const arr = Array.isArray(res?.tiles) ? res.tiles : [];
    group.forEach((x, k) => {
      const entry = arr.find((e) => Number(e?.tile) === x.id) || arr[k] || {};
      let topConf = 0;
      for (const f of Array.isArray(entry.findings) ? entry.findings : []) {
        if (!f || !TYPES.includes(f.type)) continue;
        const conf = clamp(Math.round(Number(f.confidence) || 0), 0, 100);
        const fx = Number.isFinite(Number(f.x)) ? clamp(Number(f.x), 0, 100) : 50;
        const fy = Number.isFinite(Number(f.y)) ? clamp(Number(f.y), 0, 100) : 50;
        acc.all.push({
          type: f.type,
          animal: ["mouse", "rat"].includes(f.animal) ? f.animal : "unclear",
          freshness: ["fresh", "old"].includes(f.freshness) ? f.freshness : "unclear",
          count: Math.max(0, Math.round(Number(f.count) || 0)),
          conf,
          px: ((x.crop.x + (fx / 100) * x.crop.w) / W) * 100,
          py: ((x.crop.y + (fy / 100) * x.crop.h) / H) * 100,
          note: String(f.note || "").slice(0, 240),
        });
        topConf = Math.max(topConf, conf);
      }
      for (const c of Array.isArray(entry.conditions) ? entry.conditions : []) {
        if (c && COND_KINDS.includes(c.kind)) acc.conds.push({ kind: c.kind, note: String(c.note || "").slice(0, 200) });
      }
      if (["blurry", "dark", "too_far"].includes(entry.quality)) acc.quality.add(entry.quality);
      if (entry.lookalike && String(entry.lookalike).trim()) acc.look.push(String(entry.lookalike).slice(0, 240));
      const el = cellEl(x.id);
      if (el) { el.classList.remove("scanning"); el.classList.add(topConf >= 70 ? "flag" : topConf >= 40 ? "suspect" : "clear"); }
    });
  }

  // Same sign type within 9% of the photo's longer side counts as one finding (tiles overlap).
  function dedupe(list, W, H) {
    const L = Math.max(W, H);
    const out = [];
    [...list].sort((a, b) => b.conf - a.conf).forEach((f) => {
      const o = out.find((o) => o.type === f.type && Math.hypot(((o.px - f.px) / 100) * W, ((o.py - f.py) / 100) * H) < 0.09 * L);
      if (o) {
        o.count = Math.max(o.count, f.count);
        if (o.freshness === "unclear") o.freshness = f.freshness;
        if (o.animal === "unclear") o.animal = f.animal;
        if (!o.note && f.note) o.note = f.note;
      } else out.push({ ...f });
    });
    return out;
  }

  function showResults(acc, img) {
    const seen = new Set();
    const conds = acc.conds.filter((c) => { const k = c.kind + "|" + c.note.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
    state.last = {
      list: dedupe(acc.all, img.naturalWidth, img.naturalHeight),
      quality: [...acc.quality],
      look: [...new Set(acc.look)],
      conds,
    };
    render(state.last);
  }

  function assess(list) {
    const top = list.length ? list[0].conf : 0;
    const strong = list.filter((f) => f.conf >= 70);
    const high = strong.some((f) => f.type === "rodent" || (f.type === "droppings" && f.freshness === "fresh")) || new Set(strong.map((f) => f.type)).size >= 2;
    if (high) return { cls: "v-bad", risk: "high", h: "vHighH", p: "vHighP" };
    if (top >= 70) return { cls: "v-warn", risk: "medium", h: "vSignsH", p: "vSignsP" };
    if (top >= 40) return { cls: "v-warn", risk: "medium", h: "vSusH", p: "vSusP" };
    return { cls: "v-ok", risk: "low", h: "vOkH", p: "vOkP" };
  }

  function label(f) {
    const bits = [];
    if (f.type === "droppings" && f.freshness !== "unclear") bits.push(t("f_" + f.freshness));
    if (f.animal !== "unclear") bits.push(t("a_" + f.animal));
    const base = t("t_" + f.type);
    return bits.length ? `${base} (${bits.join(", ")})` : base;
  }
  const level = (c) => (c >= 70 ? "" : c >= 40 ? " mid" : " low");

  // ---------- render ----------
  function render({ list, quality, look, conds }) {
    const a = assess(list);
    const v = $("#verdict");
    v.className = "verdict " + a.cls;
    const risk = document.createElement("p");
    risk.className = "risk";
    risk.textContent = t("riskLabel", { lvl: t("risk_" + a.risk) });
    const h = document.createElement("h2");
    h.textContent = t(a.h);
    const p = document.createElement("p");
    p.textContent = t(a.p);
    v.replaceChildren(risk, h, p);
    if (quality.length) v.append(noteEl(t("qualityNote", { q: quality.map((q) => t("q_" + q)).join(" " + t("or") + " ") })));

    const ov = $("#overlay");
    ov.querySelectorAll(".mark").forEach((m) => m.remove());
    const ol = $("#findings");
    ol.replaceChildren();
    list.forEach((f, i) => {
      const what = label(f);
      const m = document.createElement("button");
      m.type = "button";
      m.className = "mark" + level(f.conf);
      m.style.left = f.px + "%";
      m.style.top = f.py + "%";
      m.textContent = i + 1;
      m.setAttribute("aria-label", t("findingAria", { n: i + 1, what }));
      m.addEventListener("click", () => openZoom(i));
      ov.append(m);

      const li = document.createElement("li");
      const n = document.createElement("span");
      n.className = "num" + level(f.conf);
      n.textContent = i + 1;
      const body = document.createElement("div");
      const w = document.createElement("p");
      w.className = "what";
      w.textContent = what;
      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = t("confidence", { n: f.conf }) + (f.count > 1 ? ", " + t("count", { n: f.count }) : "");
      body.append(w, meta);
      if (f.note) { const d = document.createElement("p"); d.className = "desc"; d.textContent = f.note; body.append(d); }
      const zb = document.createElement("button");
      zb.type = "button";
      zb.className = "btn small";
      zb.textContent = t("closeUp");
      zb.addEventListener("click", () => openZoom(i));
      body.append(zb);
      li.append(n, body);
      ol.append(li);
    });
    ol.hidden = list.length === 0;

    const cl = $("#condList");
    cl.replaceChildren();
    conds.forEach((c) => {
      const li = document.createElement("li");
      const b = document.createElement("strong");
      b.textContent = t("c_" + c.kind) + (c.note ? ": " : "");
      li.append(b, document.createTextNode(c.note));
      cl.append(li);
    });
    $("#conds").hidden = conds.length === 0;

    const lu = $("#look");
    lu.replaceChildren();
    look.forEach((x) => { const li = document.createElement("li"); li.textContent = x; lu.append(li); });
    $("#lookWrap").hidden = look.length === 0;

    $("#result").hidden = false;
  }

  function openZoom(i) {
    const f = state.last?.list[i];
    const img = state.img;
    if (!f || !img) return;
    const W = img.naturalWidth, H = img.naturalHeight;
    const cx = (f.px / 100) * W, cy = (f.py / 100) * H;
    const side = Math.min(W, H, Math.max(Math.min(W, H) * 0.35, 320));
    const x0 = clamp(cx - side / 2, 0, W - side), y0 = clamp(cy - side / 2, 0, H - side);
    const cv = $("#zoomCanvas");
    const out = cv.width;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, out, out);
    ctx.drawImage(img, x0, y0, side, side, 0, 0, out, out);
    const rx = ((cx - x0) / side) * out, ry = ((cy - y0) / side) * out, rr = out * 0.09;
    ctx.lineWidth = 9; ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.beginPath(); ctx.arc(rx, ry, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 4; ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--danger").trim() || "#B3322A";
    ctx.beginPath(); ctx.arc(rx, ry, rr, 0, Math.PI * 2); ctx.stroke();
    $("#zoomTitle").textContent = t("zoomTitle", { n: i + 1, what: label(f) });
    $("#zoomMeta").textContent = t("confidence", { n: f.conf }) + (f.count > 1 ? ", " + t("count", { n: f.count }) : "");
    $("#zoomNote").textContent = f.note;
    $("#zoomDlg").showModal();
  }

  function noteEl(s) { const p = document.createElement("p"); p.className = "note"; p.textContent = s; return p; }

  function clearResults() {
    state.last = null;
    $("#result").hidden = true;
    $("#findings").replaceChildren();
    $("#look").replaceChildren();
    $("#condList").replaceChildren();
    $("#overlay").querySelectorAll(".mark").forEach((m) => m.remove());
  }

  function setBusy(b) {
    state.running = b;
    $("#run").disabled = b;
    $("#reset").disabled = b;
    $("#stop").hidden = !b;
    document.querySelectorAll('input[name="grid"]').forEach((r) => (r.disabled = b));
  }

  function setProgress(done, total) {
    const pct = total ? Math.round((done / total) * 100) : 0;
    const pb = $("#progress");
    pb.hidden = false;
    pb.setAttribute("aria-valuenow", String(pct));
    $("#bar").style.width = Math.max(pct, 4) + "%";
  }

  // Status is kept as keys so it can be re-rendered when the language changes.
  function setStatus(parts, err) {
    state.status = parts ? { parts, err: !!err } : null;
    renderStatus();
  }
  function renderStatus() {
    const s = $("#status");
    const st = state.status;
    s.textContent = st ? st.parts.map((p) => (typeof p === "string" ? p : t(p[0], p[1]))).join(" ") : "";
    s.classList.toggle("err", !!st?.err);
  }

  refreshKeyUI();
  applyLang();
  if (!cfg.key) $("#settings").open = true;
})();
</script>
</body>
</html>
